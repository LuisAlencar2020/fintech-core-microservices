name: Fintech Core Microservices - CI Pipeline

on: 
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura o JDK 21 usando setup-java v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Compila o serviço Java
      - name: Build Java Services
        run: |
          cd services/auth-service-java
          javac -d bin src/main/java/com/fintech/model/Cliente.java \
                      src/main/java/com/fintech/repository/ClienteRepository.java \
                      src/main/java/com/fintech/Main.java

      # 4. Configura o Python 3.9
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 5. Instala as dependências do serviço Python
      - name: Install Python Dependencies
        run: |
          cd services/analytics-python
          pip install -r requirements.txt

      # 6. Executa a aplicação Python (teste funcional do QuickSort e Redis)
      - name: Run Analytics Python Application
        run: |
          cd services/analytics-python
          python app/main.py